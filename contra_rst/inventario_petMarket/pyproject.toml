[tool.briefcase.app.inventario_petMarket.linux.system.arch]
system_requires = []
system_runtime_requires = []

[tool.briefcase.app.inventario_petMarket.linux.flatpak]
flatpak_runtime = "org.freedesktop.Platform"
flatpak_runtime_version = "25.08"
flatpak_sdk = "org.freedesktop.Sdk"

