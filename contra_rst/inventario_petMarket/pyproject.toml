# Proyecto generado con Briefcase 0.4.4
[tool.briefcase]
project_name = "inventario"
bundle = "com.whenterprise"
version = "0.0.1"
url = "https://whenterprise.com/inventario_petMarket"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
author = "William Hernandez_wh enterprise"
author_email = "william@whenterprise.com"

[tool.briefcase.app.inventario_petMarket]
formal_name = "Inventario PetMarket"
description = "Aplicación para llevar el control de inventario"
long_description = """Aplicación desarrollada con BeeWare/Toga para gestionar ventas, stock y asientos contables."""
sources = [
    "src/inventario_petMarket",
]
test_sources = [
    "tests",
]

# ⭐ DEPENDENCIAS PRINCIPALES (todas las plataformas)
requires = [
    "toga",             # Framework GUI
    "python-dotenv",    # Variables de entorno
]

# Dependencias para pruebas
test_requires = [
    "pytest"
]

# ⭐ DEPENDENCIAS SOLO PARA WINDOWS (escritorio)
[tool.briefcase.app.inventario_petMarket.windows]
requires = [
    "reportlab>=4.0.0",
    "Pillow>=9.0.0",
]

# ⭐ DEPENDENCIAS SOLO PARA macOS (escritorio)
[tool.briefcase.app.inventario_petMarket.macOS]
requires = [
    "reportlab>=4.0.0",
    "Pillow>=9.0.0",
]
universal_build = true

# ⭐ DEPENDENCIAS SOLO PARA LINUX (escritorio)
[tool.briefcase.app.inventario_petMarket.linux]
requires = [
    "reportlab>=4.0.0",
    "Pillow>=9.0.0",
]

[tool.briefcase.app.inventario_petMarket.linux.system.debian]
